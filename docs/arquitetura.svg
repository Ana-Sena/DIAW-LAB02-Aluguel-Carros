<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Arquitetura Rota Livre</title><desc id="desc">React comunica por REST com controllers Spring MVC, que usam serviços, repositórios JPA e Supabase PostgreSQL.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5" fill="#6c8853"/></marker></defs><rect width="1000" height="320" rx="16" fill="#f3f6ee"/><g font-family="sans-serif" fill="#153f35"><text x="35" y="43" font-size="22" font-weight="bold">Rota Livre · MVC e subsistemas</text><text x="35" y="70" font-size="13">Apresentação web e gestão de pedidos / contratos</text><g fill="white" stroke="#c9d6bc"><rect x="35" y="115" width="170" height="100" rx="10"/><rect x="245" y="115" width="170" height="100" rx="10"/><rect x="455" y="115" width="140" height="100" rx="10"/><rect x="635" y="115" width="140" height="100" rx="10"/><rect x="815" y="115" width="150" height="100" rx="10"/></g><g text-anchor="middle" font-size="15" font-weight="bold"><text x="120" y="153">React + Vite</text><text x="330" y="153">Spring MVC</text><text x="525" y="153">Services</text><text x="705" y="153">Repositories</text><text x="890" y="153">Supabase</text></g><g text-anchor="middle" font-size="11" fill="#738368"><text x="120" y="181">Views / formulários</text><text x="330" y="181">Controllers + DTOs</text><text x="525" y="181">Regras de negócio</text><text x="705" y="181">Spring Data JPA</text><text x="890" y="181">PostgreSQL</text></g><g stroke="#6c8853" stroke-width="2" marker-end="url(#a)"><path d="M208 165h32"/><path d="M418 165h32"/><path d="M598 165h32"/><path d="M778 165h32"/></g><text x="35" y="260" font-size="13">Segurança: sessão HTTP + BCrypt + CSRF + autorização no serviço</text><text x="35" y="287" font-size="12" fill="#738368">HTTPS e proxy /api em produção · JDBC com TLS · H2 somente no perfil demo e nos testes</text></g></svg>
